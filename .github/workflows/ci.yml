name: Repository CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Validate Python syntax across notebooks and pipelines
        run: |
          python - << 'EOF'
          import pathlib, py_compile
          py_files = sorted(pathlib.Path(".").rglob("*.py"))
          assert py_files, "No Python files found"
          for f in py_files:
              py_compile.compile(str(f), doraise=True)
              print(f"OK: {f}")
          EOF

      - name: Run Ruff fatal error checks
        run: ruff check --select E9,F63,F7 .

      - name: Enforce raw data size guardrail (< 5 MB)
        run: |
          python - << 'EOF'
          import pathlib, sys
          limit = 5 * 1024 * 1024
          violations = []
          for ext in ("*.csv", "*.parquet", "*.zip", "*.db"):
              for p in pathlib.Path(".").rglob(ext):
                  size = p.stat().st_size
                  if size > limit:
                      violations.append((str(p), round(size / (1024 * 1024), 2)))
          if violations:
              print("Large data files detected in Git:", violations)
              sys.exit(1)
          print("OK: No large raw data files committed.")
          EOF
